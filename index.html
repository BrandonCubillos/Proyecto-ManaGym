<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ManaGym - Login</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Courier New', Courier, monospace;
        }

        body {
            background-color: #191919;
            color: #39ff14;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px;
        }

        /* CARD CONTAINER */
        .login-container {
            width: 100%;
            max-width: 400px;
            background-color: #191919;
            border-left: 2px solid #8A00C4;
            padding: 24px;
            position: relative;
        }

        /* LÍNEAS DECORATIVAS */
        .line-horizontal {
            width: 100%;
            height: 2px;
            background-color: #8A00C4;
            margin-bottom: 32px;
        }

        .line-horizontal.bottom {
            margin-top: 32px;
            margin-bottom: 16px;
        }

        /* TÍTULO Y SUBTÍTULO */
        .title-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }

        .title-mana {
            color: #8A00C4;
            font-size: 36px;
            font-weight: bold;
            letter-spacing: 2px;
        }

        .title-gym {
            color: #39ff14;
            font-size: 36px;
            font-weight: bold;
            letter-spacing: 2px;
        }

        .subtitle {
            text-align: center;
            color: #39ff14;
            font-size: 11px;
            letter-spacing: 2px;
            margin-top: 4px;
        }

        .title-separator {
            width: 120px;
            height: 2px;
            background-color: #8A00C4;
            margin: 16px auto 48px auto;
        }

        /* FORMULARIO Y INPUTS */
        .form-group {
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
        }

        .form-group label {
            color: #39ff14;
            font-size: 12px;
            margin-bottom: 6px;
            letter-spacing: 1px;
        }

        .form-group input {
            width: 100%;
            height: 48px;
            background-color: #191919;
            border: 2px solid #8A00C4;
            color: #39ff14;
            padding: 0 12px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
        }

        .form-group input:focus {
            border-color: #39ff14;
            box-shadow: 0 0 8px rgba(57, 255, 20, 0.4);
        }

        .form-group input::placeholder {
            color: #8A00C4;
            opacity: 0.7;
        }

        /* BOTÓN DE INICIO DE SESIÓN */
        .btn-login {
            width: 100%;
            height: 56px;
            background-color: #191919;
            border: 2px solid #8A00C4;
            color: #39ff14;
            font-size: 14px;
            font-weight: bold;
            letter-spacing: 1px;
            cursor: pointer;
            margin-top: 16px;
            transition: background-color 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
        }

        .btn-login:hover {
            background-color: #8A00C4;
            color: #191919;
            box-shadow: 0 0 12px rgba(138, 0, 196, 0.6);
        }

        /* RECUPERAR CONTRASEÑA */
        .forgot-password {
            display: block;
            text-align: center;
            color: #39ff14;
            font-size: 12px;
            text-decoration: none;
            margin-top: 24px;
            letter-spacing: 1px;
        }

        .forgot-password:hover {
            text-decoration: underline;
        }

        /* FOOTER */
        .footer {
            text-align: center;
            color: #8A00C4;
            font-size: 10px;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <div class="login-container">
        <!-- LÍNEA DECORATIVA SUPERIOR HORIZONTAL -->
        <div class="line-horizontal"></div>

        <!-- TÍTULO DE LA APP -->
        <div class="title-container">
            <span class="title-mana">MANA</span>
            <span class="title-gym">GYM</span>
        </div>
        <div class="subtitle">SISTEMA DE ACCESO // INICIO DE SESION</div>

        <!-- LÍNEA DECORATIVA BAJO EL TÍTULO -->
        <div class="title-separator"></div>

        <!-- FORMULARIO DE ACCESO -->
        <form onsubmit="return false;">
            <div class="form-group">
                <label for="userId">ID DE USUARIO // CORREO</label>
                <input type="email" id="userId" placeholder="ingresa nombre de usuario" required>
            </div>

            <div class="form-group">
                <label for="password">ACCESS_KEY // CONTRASEÑA</label>
                <input type="password" id="password" placeholder="••••••••" required>
            </div>

            <button type="submit" class="btn-login">[ INICIAR_SESION ]</button>
        </form>

        <a href="#" class="forgot-password">&gt; RECUPERAR CONTRASEÑA</a>

        <!-- LÍNEA DECORATIVA INFERIOR HORIZONTAL -->
        <div class="line-horizontal bottom"></div>

        <!-- PIE DE PÁGINA -->
        <div class="footer">MANAGYM OS v0.1 // NECESITAS AYUDA? CONTACTANOS</div>
    </div>

</body>
</html>
